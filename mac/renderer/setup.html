<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; style-src 'self' 'unsafe-inline'; img-src 'self'">
	<title>Blockwise</title>
	<link rel="stylesheet" href="app.css">
</head>
<body class="setup">
	<main class="u-card">
		<img src="../assets/icon.png" alt="" class="u-logo" width="64" height="64">
		<h1 id="title"></h1>
		<p id="intro" class="u-muted"></p>

		<!-- 1. Where your data lives -->
		<div id="step-choose" class="u-choices" role="list"></div>

		<!-- 2a. Nextcloud -->
		<form id="step-nextcloud" hidden>
			<label for="server" id="server-label"></label>
			<input id="server" type="text" autocomplete="url" spellcheck="false" autocapitalize="off" required>
			<button type="submit" id="submit" class="u-primary"></button>
			<button type="button" class="u-link js-back"></button>
		</form>

		<!-- 2b. Passphrase for a drive -->
		<form id="step-passphrase" hidden>
			<label for="pass" id="pass-label"></label>
			<input id="pass" type="password" autocomplete="new-password" spellcheck="false" required>
			<div id="confirm-row">
				<label for="pass2" id="pass2-label"></label>
				<input id="pass2" type="password" autocomplete="new-password" spellcheck="false">
			</div>
			<p id="pass-hint" class="u-hint"></p>
			<button type="submit" id="pass-submit" class="u-primary"></button>
			<button type="button" id="no-encrypt" class="u-link"></button>
			<button type="button" class="u-link js-back"></button>
		</form>

		<!-- 2c. Without encryption: asked once more -->
		<div id="step-plain" hidden>
			<p id="plain-warning" class="u-warning"></p>
			<button type="button" id="plain-go" class="u-secondary"></button>
			<button type="button" id="plain-back" class="u-link"></button>
		</div>

		<p id="error" class="u-error" role="alert" hidden></p>

		<div id="waiting" hidden>
			<p id="waiting-text"></p>
			<button type="button" id="cancel" class="u-secondary"></button>
		</div>
	</main>
	<script src="i18n.js"></script>
	<script src="setup.js"></script>
</body>
</html>
