plugins {
    id 'com.android.application'
}

android {
    namespace 'app.tracker.android'
    compileSdk 36

    defaultConfig {
        applicationId 'app.tracker.nextcloud'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation project(':core')
}

// Tracker's interface comes from the Nextcloud app next to this project
// (../tracker), so all three stay identical. Without it, the copy already in
// src/main/assets/web is used.
def trackerDir = rootProject.file('../tracker')
def webDir = file('src/main/assets/web')

tasks.register('syncWeb') {
    description = 'Copies Tracker\'s interface from ../tracker into the app.'
    onlyIf { new File(trackerDir, 'appinfo/info.xml').exists() }
    inputs.files(new File(trackerDir, 'js/tracker.js'), new File(trackerDir, 'css/tracker.css'), new File(trackerDir, 'l10n/it.json'))
    outputs.dir(webDir)
    doLast {
        webDir.mkdirs()
        ['js/tracker.js': 'tracker.js', 'css/tracker.css': 'tracker.css'].each { from, to ->
            new File(webDir, to).bytes = new File(trackerDir, from).bytes
        }
        def italian = new groovy.json.JsonSlurper().parse(new File(trackerDir, 'l10n/it.json'), 'UTF-8').translations
        new File(webDir, 'l10n.js').setText('window.__trackerL10n = ' + groovy.json.JsonOutput.toJson([it: italian]) + '\n', 'UTF-8')
        def version = (new File(trackerDir, 'appinfo/info.xml').getText('UTF-8') =~ /<version>([^<]+)<\/version>/)[0][1]
        logger.lifecycle("syncWeb: copied Tracker ${version} interface")
    }
}
tasks.named('preBuild') { dependsOn 'syncWeb' }

android {
    lint {
        // Calls that don't exist on older Android versions, missing permissions etc. fail the build
        abortOnError true
        checkReleaseBuilds true
        textReport true
        // Newer library versions or SDK levels are suggestions, not errors
        disable 'GradleDependency', 'OldTargetApi', 'AndroidGradlePluginVersion', 'NewerVersionAvailable'
    }
}
