<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; style-src 'self' 'unsafe-inline'; img-src 'self'">
	<title>Tracker</title>
	<link rel="stylesheet" href="app.css">
	<link rel="stylesheet" href="android.css">
	<link rel="stylesheet" href="android-setup.css">
</head>
<body class="setup">
	<main class="u-card">
		<img src="icon.png" alt="" class="u-logo" width="72" height="72">
		<h1 id="title"></h1>
		<p id="intro" class="u-muted"></p>
		<form id="form">
			<label for="server" id="server-label"></label>
			<input id="server" type="text" autocomplete="url" spellcheck="false" autocapitalize="off" required>
			<p id="error" class="u-error" role="alert" hidden></p>
			<button type="submit" id="submit" class="u-primary"></button>
		</form>
		<div id="waiting" hidden>
			<p id="waiting-text"></p>
			<button type="button" id="cancel" class="u-secondary"></button>
		</div>
	</main>
	<script src="android-bridge.js"></script>
	<script src="i18n.js"></script>
	<script src="setup.js"></script>
</body>
</html>
