# Builds the app on GitHub: every push runs the tests, builds the APK and
# publishes it as the "latest" release, so you can download it on your phone
# (Releases → latest → app-debug.apk).
name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # GitHub's Ubuntu machines come with the Android SDK (ANDROID_HOME is set);
      # Gradle downloads the exact platform and build tools it needs.
      - name: Test and build
        run: ./gradlew --no-daemon --stacktrace :core:coreTest :app:assembleDebug :app:lintDebug
      - name: Lint findings
        if: always()
        run: cat app/build/reports/lint-results-debug.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
      - uses: actions/upload-artifact@v4
        with:
          name: tracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk \
            --title "Tracker for Android (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download app-debug.apk on your phone and open it to install." \
            --prerelease
