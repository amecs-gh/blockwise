# Builds the Mac app on GitHub's Apple silicon machines: tests, the Apple
# Calendar helper, Blockwise.app (signed ad hoc), and from main a disk image
# published as the "mac-latest" release (Blockwise-mac.dmg), the file the
# website links to. Not notarized: see mac/README.md.
#
# Dropbox and Google Drive appear in the app when these repository variables
# are set (Settings → Secrets and variables → Actions → Variables; they are app
# ids, not secrets): DROPBOX_APP_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET.
name: Mac
on:
  push:
    paths: ['mac/**', 'nextcloud/js/**', 'nextcloud/css/**', 'nextcloud/l10n/**', 'nextcloud/appinfo/info.xml', '.github/workflows/mac.yml']
  workflow_dispatch:
permissions:
  contents: write # only to publish the release
defaults:
  run:
    working-directory: mac
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: App keys for Dropbox and Google Drive
        env:
          DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ vars.GOOGLE_CLIENT_SECRET }}
        run: |
          node -e 'const e=process.env; require("fs").writeFileSync("config/providers.json", JSON.stringify({dropboxAppKey: e.DROPBOX_APP_KEY||"", googleClientId: e.GOOGLE_CLIENT_ID||"", googleClientSecret: e.GOOGLE_CLIENT_SECRET||""}))'
      - name: Build
        run: npm run build
      - name: Check the app
        run: |
          APP=dist/mac-arm64/Blockwise.app
          test -x "$APP/Contents/Resources/blockwise-calendar"
          /usr/libexec/PlistBuddy -c 'Print :NSCalendarsFullAccessUsageDescription' "$APP/Contents/Info.plist"
          codesign --verify --deep "$APP"
          npx --yes @electron/fuses@1.8.0 read --app "$APP"
      - name: Start the app (it must keep running)
        run: |
          APP=dist/mac-arm64/Blockwise.app
          "$APP/Contents/MacOS/Blockwise" > launch.log 2>&1 &
          PID=$!
          sleep 20
          if ! kill -0 $PID 2>/dev/null; then
            echo "Blockwise quit at launch:"; cat launch.log
            ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -3 | while read f; do head -60 ~/Library/Logs/DiagnosticReports/"$f"; done
            exit 1
          fi
          echo "running after 20 s"; kill $PID
      - name: Disk image
        run: |
          # The app next to a link to Applications: drag one onto the other
          mkdir dmg && ditto dist/mac-arm64/Blockwise.app dmg/Blockwise.app && ln -s /Applications dmg/Applications
          hdiutil create -volname Blockwise -srcfolder dmg -ov -format UDZO Blockwise-mac.dmg
          hdiutil verify Blockwise-mac.dmg
      - name: Publish as the "mac-latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mac-latest --yes --cleanup-tag || true
          gh release create mac-latest Blockwise-mac.dmg \
            --title "Blockwise for Mac (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Apple silicon, macOS 13 or later. Not notarized: the first time, open it from System Settings → Privacy & Security → Open Anyway." \
            --prerelease
